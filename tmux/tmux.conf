# ========================================
# 基本設定
# ========================================

# デフォルトシェル
set -g default-shell /bin/zsh

# True Color 対応
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Mac の Homebrew パスを追加
set-environment -g PATH "/opt/homebrew/bin:/bin:/usr/bin"

# ========================================
# プレフィックスキー設定
# ========================================

# プレフィックスキーを Ctrl+w に変更
set -g prefix C-w
unbind C-b
bind C-w send-prefix

# ========================================
# コピーモード設定
# ========================================

# vim キーバインドを使用
setw -g mode-keys vi

# v: 選択開始
bind -T copy-mode-vi v send -X begin-selection

# V: 行選択
bind -T copy-mode-vi V send -X select-line

# Ctrl+v: 矩形選択
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ========================================
# プラグイン設定
# ========================================

# プラグインマネージャー
set -g @plugin 'tmux-plugins/tpm'

# 便利オプション集
set -g @plugin 'tmux-plugins/tmux-sensible'

# セッション復元
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-vim 'session'

# クリップボード連携（Mac用）
set -g @plugin 'tmux-plugins/tmux-yank'
set -g default-command "reattach-to-user-namespace -l $SHELL"

# vim ライクなペイン操作
set -g @plugin 'tmux-plugins/tmux-pain-control'

# マウス操作
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g mouse on
set -g @scroll-speed-num-lines-per-scroll 1

# テーマ（Dracula）
set -g @plugin 'dracula/tmux'

# ========================================
# ロギング機能
# ========================================

# Ctrl+w, Ctrl+p: ロギング開始
bind C-p pipe-pane -o '/bin/sh -c "while read -r LINE; do echo \"[\$(date +\"%%Y_%%m%%d_%%H%%M%%S_%%N\")] \${LINE}\" >> \${HOME}/.tmux/log/\$(date +%Y%m%d-%H%M%S)-#S-#I.#P.log; done "' \; display-message "Logging start."

# Ctrl+w, Ctrl+o: ロギング停止
bind C-o pipe-pane \; display-message "Logging end."

# Ctrl+w, v: ロギング有効な新規ウィンドウを開く
bind v new-window -n 'logging...' \; pipe-pane -o '/bin/sh -c "while read -r LINE; do echo \"[\$(date +\"%%Y_%%m%%d_%%H%%M%%S_%%N\")] \${LINE}\" >> \${HOME}/.tmux/log/\$(date +%Y%m%d-%H%M%S)-#S-#I.#P.log; done "'

# ========================================
# プラグインマネージャーの初期化
# この行は必ずファイルの最後に配置すること
# ========================================
run '~/.tmux/plugins/tpm/tpm'
